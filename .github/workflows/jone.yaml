name: Jone Test and Image

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: jone-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # PR tests use isolated GitHub-hosted runners, not the internal network.
    runs-on: ${{ github.event_name == 'push' && 'arc-dibot' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.10'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Engine and real HTTP regression tests
        run: |
          python -m unittest discover -s tests -v
          node --check static/app.js

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: arc-dibot
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.ci-build.svc.cluster.local:1234
      - name: Build dedicated image (not devbox)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Read-only non-root container health smoke
        shell: bash
        run: |
          set -euo pipefail
          cid=$(docker run -d --read-only --cap-drop ALL --security-opt no-new-privileges --env APP_VERSION="$GITHUB_SHA" "$IMAGE:$GITHUB_SHA")
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          test "$(docker inspect --format '{{.Config.User}}' "$cid")" = '10001:10001'
          for attempt in $(seq 1 20); do
            if docker exec "$cid" python3 -c 'import json,os,urllib.request; h=json.load(urllib.request.urlopen("http://127.0.0.1:8080/healthz",timeout=2)); assert h == {"ok":True,"version":os.environ["APP_VERSION"]}'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$cid"
          exit 1
      - name: Publish tested image and report immutable pin
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE:$GITHUB_SHA"
          pin=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")
          echo "### Jone image published" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin: $pin" >> "$GITHUB_STEP_SUMMARY"
          echo 'Before activation: verify anonymous GHCR pull and independently review exact digest in the separate deployment repository.' >> "$GITHUB_STEP_SUMMARY"
